name: cla

# Asks each new contributor to agree to CLA.md on their first pull request, and remembers who has
# (signatures/cla.json on the cla-signatures branch).

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: github.repository == 'NiceTryBot/nicetrybot'
    runs-on: ubuntu-latest
    steps:
      - name: Contributor License Agreement
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/NiceTryBot/nicetrybot/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],NiceTryBot
