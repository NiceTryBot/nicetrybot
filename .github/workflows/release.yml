name: release

# Publishes a release of NiceTryBot when a version tag is pushed here:
#
#   git tag -a v1.2.0 -m "What changed" && git push origin v1.2.0
#
# It runs the tests and the edge's Go tests on the tag while it builds the app, edge and Vector images
# for amd64 and arm64 (each on a runner of its own platform), and once both pass tags them in
# ghcr.io/nicetrybot/{app,edge,vector} as 1.2.0 (and latest, unless the tag is a pre-release like
# v1.2.0-beta.1), then creates the GitHub release with what the
# installer downloads: compose.yml, compose.addons.yml, env.example (deploy/.env.example; GitHub
# renames assets that start with a dot), install.sh and nicetrybot (the command it installs). The
# tag's message becomes the release notes; a lightweight tag gets notes generated from the pull
# requests since the last release.
#
# To build and publish a tag again (a failed run, a fixed workflow): Run workflow, with the tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build and release again, like v1.2.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Work out the version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::\"$TAG\" isn't a release tag like v1.2.0 or v1.2.0-beta.1."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent || { echo "::error::There's no tag $TAG."; exit 1; }
          version=${TAG#v}
          prerelease=false
          [[ $version == *-* ]] && prerelease=true
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG as $version (pre-release: $prerelease)."

  tests:
    needs: version
    uses: ./.github/workflows/tests.yml
    with:
      ref: refs/tags/${{ needs.version.outputs.tag }}

  edge-tests:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: edge/caddy/nicetry-capture/go.mod
          cache-dependency-path: edge/caddy/nicetry-capture/go.sum

      - name: The edge's Go tests
        working-directory: edge/caddy/nicetry-capture
        run: |
          go vet ./...
          go test ./...

  # Each image is built for each platform on a runner of that platform (arm64 on GitHub's arm64
  # runners, not under QEMU, which took the edge's Go build 40 minutes), pushed by digest, then
  # joined into one multi-platform tag by the manifests job. They build while the tests run: nothing is
  # tagged until both pass.
  images:
    needs: version
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: app
            context: .
            file: deploy/Dockerfile
            target: app
            description: NiceTryBot's control panel, worker and scheduler.
          - name: edge
            context: edge
            file: edge/Dockerfile
            target: edge
            description: NiceTryBot's edge, Caddy with the capture module.
          - name: vector
            context: edge
            file: edge/Dockerfile
            target: vector
            description: Vector, shipping NiceTryBot's edge logs to the app or a bucket.
        platform:
          - name: linux/amd64
            slug: amd64
            runner: ubuntu-24.04
          - name: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: When
        id: when
        run: echo "created=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image.name }} for ${{ matrix.platform.name }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: ${{ matrix.platform.name }}
          outputs: type=image,name=ghcr.io/nicetrybot/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          # The app's image knows its release (NICETRY_RELEASE), for the panel's update notice.
          build-args: |
            NICETRY_RELEASE=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=nicetrybot-${{ matrix.image.name }}
            org.opencontainers.image.description=${{ matrix.image.description }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://nicetrybot.com
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.when.outputs.created }}
            org.opencontainers.image.licenses=Elastic-2.0
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.slug }}

      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # One tag per image (1.2.0, and latest unless it's a pre-release) over both platforms' digests.
  manifests:
    needs: [version, tests, edge-tests, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [app, edge, vector]
    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tag ${{ matrix.image }}
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/nicetrybot/${{ matrix.image }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          tags=(-t "$IMAGE:$VERSION")
          [[ $PRERELEASE == true ]] || tags+=(-t "$IMAGE:latest")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          [[ ${#sources[@]} -eq 2 ]] || { echo "::error::Expected 2 platforms for $IMAGE, got ${#sources[@]}."; exit 1; }
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  release:
    needs: [version, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          # A shallow checkout can leave the tag lightweight; fetch it whole for its message.
          git fetch --quiet --force origin "+refs/tags/$TAG:refs/tags/$TAG"

          assets=$RUNNER_TEMP/assets
          mkdir -p "$assets"
          cp deploy/compose.yml deploy/compose.addons.yml deploy/install.sh deploy/nicetrybot "$assets/"
          # The command knows the release it came from, for nicetrybot cli version and cli update.
          sed -i "s/^cli_version=dev\$/cli_version=$VERSION/" "$assets/nicetrybot"
          grep -qx "cli_version=$VERSION" "$assets/nicetrybot" || { echo "::error::Couldn't write the release into the nicetrybot command."; exit 1; }
          cp deploy/.env.example "$assets/env.example"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$assets"/* --clobber
            echo "Updated the files on release $TAG."
            exit 0
          fi

          notes=(--generate-notes)
          if [[ $(git cat-file -t "refs/tags/$TAG") == tag ]]; then
            git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/notes.md"
            [[ -s $RUNNER_TEMP/notes.md ]] && notes=(--notes-file "$RUNNER_TEMP/notes.md")
          fi

          kind=(--latest)
          [[ $PRERELEASE == true ]] && kind=(--prerelease --latest=false)

          gh release create "$TAG" "$assets"/* --verify-tag --title "NiceTryBot $VERSION" "${notes[@]}" "${kind[@]}"
          echo "Released $TAG."
